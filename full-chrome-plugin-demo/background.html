<!DOCTYPE html>
<html>
<head>
	<title>ip wash</title>
	<meta charset="utf-8"/>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
	<style>
	html,body{height: 100%;font-size: 16px;}
	body{font-family: 'Microsoft Yahei';margin:0;padding:0;}
	.container {
		width: 1024px;
		margin: 0 auto;
	}

	.error {
		position: fixed;
		top: 0;
		left: 50%;
		transform: translateX(-50%);
		background-color: red;
		color: white;
		padding: 10px;
		z-index: 1000;
		display: none;
	}
	</style>
</head>
<body>
	<div class="container">
		<h1>this is ip wash control page</h1>
		<h2>ip wash url management</h2>
		<div>
			<input id="url" placeholder="please input web url for ip wash"></input>
			<a href="#" id="save_url">save url</a>
			<h3>already saved url</h3>
			<ul id="urlList"></ul>
		</div>
		<h2>this is ip wash control page</h2>
		<div>
			<input id="interval" placeholder="url open interval, suggest 15" style="width: 180px;" value="15"></input>
			<a href="#" id="start_wash">start wash</a>
			<a href="#" id="stop_wash">stop wash</a>
		</div>
	</div>
	<script type="text/javascript" src="js/jquery-1.8.3.js"></script>
	<script type="text/javascript" src="js/background.js"></script>
</body>
</html>
